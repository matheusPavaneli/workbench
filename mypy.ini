# Type check CI holds lib/ to. python_version is the lowest mypy still accepts;
# the 3.9 floor is held by ruff's UP rules and tests/test_structure.py.
# platform=linux: on win32 mypy prunes the keychain branches in secrets.py and
# reports names they define as undefined.
[mypy]
files = lib
mypy_path = lib
python_version = 3.10
platform = linux
